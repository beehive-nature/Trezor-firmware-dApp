[package]
name = "bpq-device-xcheck"
version = "0.0.0"
edition = "2021"
publish = false
description = "Rust oracle for crypto/bpq/emu_xcheck.py: beehive-nature's crates/bsigner/src/bpq.rs, compiled unmodified (inner doc comments stripped) from BEEHIVE_NATURE."

# Standalone: not part of any workspace in this repository.
[workspace]

# Versions pinned to beehive-nature's Cargo.lock for bsigner.
[dependencies]
aes-gcm = "=0.10.3"
bech32 = "=0.9.1"
hkdf = "=0.12.4"
ml-dsa = { version = "=0.1.1", features = ["getrandom", "zeroize"] }
ml-kem = { version = "=0.3.2", features = ["getrandom"] }
serde_json = "1"
sha2 = "=0.10.9"
sha3 = "=0.10.9"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = "=1.9.0"
